[package]
name        = "shadows-desktop"
version     = "0.3.0"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
description = "Relay: register your machine with a clawborrator hub by pairing through the shadows app (Google/Zoho). Fork of desktop_v1."
# build.rs embeds the Windows .exe icon (no-op on non-Windows hosts).
build       = "build.rs"

# The distributed binary is named `relay` (relay.exe on Windows). The
# crate/package stays shadows-desktop to keep the fork diff small.
[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
tokio              = { workspace = true }
tokio-tungstenite  = { workspace = true }
futures-util       = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
clap               = { workspace = true }
hostname           = { workspace = true }
dirs               = { workspace = true }
url                = { workspace = true }
uuid               = { workspace = true }
reqwest            = { workspace = true }
webbrowser         = { workspace = true }
sha2               = { workspace = true }
base64             = { workspace = true }
rand               = { workspace = true }
portable-pty       = { workspace = true }
vt100              = { workspace = true }
chrono             = { workspace = true }
tracing-appender   = { workspace = true }
whoami             = { workspace = true }
interprocess       = { workspace = true }
crossterm          = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys        = { workspace = true }

# Compiles the Relay icon (assets/app-icon.ico) into relay.exe so
# Explorer / taskbar / Alt-Tab / the wizard window show the app icon.
# Build-dependency only, and only on Windows hosts — see build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource        = "0.1"

# Tray UI + first-run setup wizard (src/gui.rs) — shared by the Windows
# and macOS daemon paths. Linux stays headless (systemd-user service,
# no GUI session guarantee), so it pulls neither the tray nor the egui
# GUI stack.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon          = { workspace = true }
image              = { workspace = true }
eframe             = "0.28"

# macOS needs an NSApplication to host the menu-bar status item.
[target.'cfg(target_os = "macos")'.dependencies]
objc2              = { workspace = true }
objc2-app-kit      = { workspace = true }
objc2-foundation   = { workspace = true }
