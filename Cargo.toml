[workspace]
resolver = "2"
members = ["clawborrator-supervisor"]

[workspace.package]
edition      = "2021"
license      = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
tokio              = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "io-util", "io-std", "net", "sync"] }
tokio-tungstenite  = { version = "0.24", default-features = false, features = ["rustls-tls-native-roots", "connect"] }
futures-util       = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap               = { version = "4", features = ["derive", "env"] }
hostname           = "0.4"
dirs               = "5"
url                = "2"
uuid               = { version = "1", features = ["v4"] }
reqwest            = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
webbrowser         = "1"
sha2               = "0.10"
base64             = "0.22"
rand               = "0.8"
portable-pty       = "0.8"
vt100              = "0.15"
chrono             = { version = "0.4", default-features = false, features = ["clock"] }
tracing-appender   = "0.2"
whoami             = "1"
interprocess       = { version = "2", features = ["tokio"] }
crossterm          = "0.28"
windows-sys        = { version = "0.59", features = ["Win32_System_Console", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
tray-icon          = "0.21"
image              = { version = "0.25", default-features = false, features = ["png"] }
objc2              = "0.6"
objc2-app-kit      = { version = "0.3", features = ["NSApplication", "NSResponder", "NSEvent"] }
objc2-foundation   = { version = "0.3", features = ["NSDate", "NSRunLoop", "NSString"] }
